name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
body:
  - type: input
    id: environment
    attributes:
      label: Node.js version and operating system
      placeholder: Node.js 24 / Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
      description: Remove tokens, cookies, email addresses and other personal information.
    validations:
      required: true
